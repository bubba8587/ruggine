[package]
name = "ruggine-engine"
description = "A Rust port of rete-engine's dataflow and control-flow engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruggine = { path = "../ruggine" }

[lints]
