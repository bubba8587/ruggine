[package]
name = "ruggine-bench"
description = "Workloads timed against upstream rete by tools/bench/compare.mjs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ruggine-bench"
path = "src/main.rs"

[dependencies]
ruggine = { path = "../crates/ruggine" }
ruggine-engine = { path = "../crates/ruggine-engine" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true
